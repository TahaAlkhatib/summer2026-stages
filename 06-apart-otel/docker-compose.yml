# Apart & Otel projesi icin MongoDB
#
# Not: Varsayilan MongoDB portu 27017 yerine 27018 kullaniliyor.
# Bilgisayarinizda baska bir MongoDB calisiyorsa cakismasin diye.
services:
  mongo:
    image: mongo:7
    container_name: apartotel-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - apartotel-mongo-data:/data/db

volumes:
  apartotel-mongo-data:
